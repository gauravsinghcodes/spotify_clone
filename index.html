<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone </title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://open.spotifycdn.com/cdn/images/favicon16.1c487bff.png">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="img/logo.svg" alt="Spotify" class="logo invert">
                <button class="close-btn invert" id="close-sidebar">&times;</button>
            </div>

            <nav class="nav-links">
                <ul>
                    <li class="active"><a href="#"><img src="img/home.svg" class="invert" alt="Home"> Home</a></li>
                    <li><a href="#"><img src="img/search.svg" class="invert" alt="Search"> Search</a></li>
                </ul>
            </nav>

            <div class="library-section">
                <div class="library-header">
                    <img src="img/playlist.svg" class="invert" alt="Library">
                    <span>Your Library</span>
                </div>
                <!-- Dynamic Playlist List (Optional - for now static or minimal) -->
                <div class="library-content">
                    <p class="hint-text">Create your first playlist</p>
                    <button class="small-btn">Create playlist</button>
                </div>
            </div>

            <div class="sidebar-footer">
                <a href="#">Legal</a>
                <a href="#">Privacy Center</a>
                <a href="#">Privacy Policy</a>
                <a href="#">Cookies</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header/Top Bar -->
            <header class="top-bar">
                <div class="nav-controls">
                    <button class="circle-btn" id="sidebar-toggle"><img src="img/hamburger.svg" class="invert"
                            alt="Menu"></button>
                    <button class="circle-btn" id="back-btn">&lt;</button>
                    <button class="circle-btn">&gt;</button>
                </div>
                <div class="auth-buttons">
                    <button class="btn-text">Sign up</button>
                    <button class="btn-white">Log in</button>
                </div>
            </header>

            <!-- Playlist View -->
            <div class="content-scroll">
                <div class="playlist-grid-section">
                    <h2>Spotify Playlists</h2>
                    <div class="card-container" id="playlist-container">
                        <!-- Javascript will inject cards here -->
                    </div>
                </div>

                <div class="song-list-section hidden" id="song-list-view">
                    <div class="playlist-hero">
                        <div class="hero-image" id="hero-image">
                            <img src="" alt="Playlist Art">
                        </div>
                        <div class="hero-info">
                            <span>Playlist</span>
                            <h1 id="playlist-title">Playlist Title</h1>
                            <p id="playlist-desc">Description or Artist info</p>
                        </div>
                    </div>

                    <div class="playlist-actions">
                        <button class="play-btn-large" id="play-all-btn">
                            <img src="img/play.svg" alt="Play">
                        </button>
                    </div>

                    <div class="songs-container">
                        <div class="song-header-row">
                            <span>#</span>
                            <span>Title</span>
                            <span>Artist</span>
                        </div>
                        <ul id="current-song-list">
                            <!-- Songs go here -->
                        </ul>
                    </div>
                </div>
            </div>
        </main>

        <!-- Playbar -->
        <footer class="playbar">
            <div class="now-playing">
                <img src="img/music.svg" alt="Art" class="track-art invert" id="min-track-art">
                <div class="track-info">
                    <div class="track-name" id="track-name">Song Name</div>
                    <div class="track-artist" id="track-artist">Artist</div>
                </div>
            </div>

            <div class="player-controls">
                <div class="control-buttons">
                    <button class="control-btn" id="prev"><img src="img/prevsong.svg" class="invert"
                            alt="Prev"></button>
                    <button class="control-btn play-pause-btn" id="play"><img src="img/play.svg" class="invert"
                            alt="Play"></button>
                    <button class="control-btn" id="next"><img src="img/nextsong.svg" class="invert"
                            alt="Next"></button>
                </div>
                <div class="playback-bar">
                    <span id="current-time">0:00</span>
                    <div class="progress-container" id="seekbar">
                        <div class="progress-bar" id="seekbar-fill"></div>
                        <div class="progress-thumb" id="seekbar-thumb"></div>
                    </div>
                    <span id="total-time">0:00</span>
                </div>
            </div>

            <div class="volume-controls">
                <img src="img/volume.svg" class="invert" alt="Vol">
                <input type="range" id="volume-range" min="0" max="100" value="50">
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
